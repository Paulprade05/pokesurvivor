# Versión para Windows: compila las dos apps de Windows y las sube a una
# release de GitHub.
#   - PokeSurvivor-Windows-Setup.exe: instalador (Inno Setup 6,
#     desktop-rust/instalador.iss) con la app en Rust (wry/tao sobre WebView2).
#     Es la descarga principal desde la 0.7.0: la buscan js/ui/windows-dl.js
#     (Ajustes › Acerca de) y el aviso de versión nueva de las dos apps.
#   - Los .zip portátiles de siempre (Rust ~110 MB, Electron ~255 MB), de
#     respaldo y para las apps 0.6.0 y anteriores, que sólo buscan .zip.
#     PRINCIPAL dice cuál va con el nombre fijo PokeSurvivor-Windows.zip; la otra
#     va como PokeSurvivor-Windows-Rust.zip o PokeSurvivor-Windows-Electron.zip.
#
# Se lanza al empujar una etiqueta win-vX.Y.Z (X.Y.Z = "version" de
# desktop/package.json y de desktop-rust/Cargo.toml) o a mano desde la pestaña
# Actions con esa etiqueta. Usa la versión web YA COMPILADA que hay en el commit
# (index.html, js/app.min.js...): no compila el juego ni publica la web.
# Gratis: runner de GitHub (con Rust y C++ de Visual Studio ya instalados) y el
# token del propio workflow, sin secretos nuevos.
name: Versión para Windows

on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta de la release (win-vX.Y.Z, igual que desktop/package.json y desktop-rust/Cargo.toml)'
        required: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.etiqueta }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
      # electron | rust: la que se publica como PokeSurvivor-Windows.zip (el
      # instalador lleva siempre la de Rust).
      PRINCIPAL: electron
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Comprobar etiqueta y versión de las apps
        run: |
          set -euo pipefail
          if ! [[ "$ETIQUETA" =~ ^win-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La etiqueta tiene que ser win-vX.Y.Z (es '$ETIQUETA')"; exit 1
          fi
          VERSION="${ETIQUETA#win-v}"
          APP="$(node -p "require('./desktop/package.json').version")"
          RUST="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' desktop-rust/Cargo.toml | head -1)"
          if [ "$VERSION" != "$APP" ] || [ "$VERSION" != "$RUST" ]; then
            echo "::error::La etiqueta es $VERSION pero desktop/package.json dice $APP y desktop-rust/Cargo.toml $RUST: súbelas antes."; exit 1
          fi
          if [ "$PRINCIPAL" = rust ]; then
            echo "ZIP_RUST=PokeSurvivor-Windows.zip" >> "$GITHUB_ENV"
            echo "ZIP_ELECTRON=PokeSurvivor-Windows-Electron.zip" >> "$GITHUB_ENV"
          else
            echo "ZIP_RUST=PokeSurvivor-Windows-Rust.zip" >> "$GITHUB_ENV"
            echo "ZIP_ELECTRON=PokeSurvivor-Windows.zip" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HUELLA=$(node -p "require('./version.json').v")" >> "$GITHUB_ENV"

      # ---- App en Rust ----
      - name: Preparar Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            desktop-rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop-rust/Cargo.lock') }}

      - name: Probar la app de Rust
        working-directory: desktop-rust
        run: cargo test --locked --release

      - name: Compilar y empaquetar la app de Rust
        working-directory: desktop-rust
        run: node empaquetar.cjs "$ZIP_RUST"

      # ---- Instalador (app de Rust) ----
      # Inno Setup 6 viene en las imágenes windows-latest de GitHub; si faltara,
      # se instala con Chocolatey (paquete innosetup, que baja de jrsoftware.org).
      - name: Crear el instalador
        working-directory: desktop-rust
        run: |
          set -euo pipefail
          ISCC_DIR="/c/Program Files (x86)/Inno Setup 6"
          if [ ! -f "$ISCC_DIR/ISCC.exe" ] && ! command -v ISCC.exe >/dev/null; then
            choco install innosetup -y --no-progress
          fi
          if [ -f "$ISCC_DIR/ISCC.exe" ]; then export PATH="$ISCC_DIR:$PATH"; fi
          node instalador.cjs

      # ---- App Electron (respaldo) ----
      - name: Instalar Electron y el empaquetador
        working-directory: desktop
        env:
          # @electron/packager baja su propio Electron; el de npm no hace falta.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Copiar la web compilada y empaquetar Electron
        working-directory: desktop
        run: |
          npm run empaquetar
          if [ "$ZIP_ELECTRON" != PokeSurvivor-Windows.zip ]; then mv dist/PokeSurvivor-Windows.zip "dist/$ZIP_ELECTRON"; fi

      - name: Comprobar los paquetes
        run: |
          set -euo pipefail
          test -f desktop-rust/dist/PokeSurvivor/PokeSurvivor.exe
          test -f desktop-rust/dist/PokeSurvivor/www/index.html
          test -f desktop/dist/PokeSurvivor/PokeSurvivor.exe
          test -f desktop/dist/PokeSurvivor/resources/app.asar
          test -f desktop-rust/dist/PokeSurvivor-Windows-Setup.exe
          ls -l desktop-rust/dist/PokeSurvivor-Windows-Setup.exe "desktop-rust/dist/$ZIP_RUST" "desktop/dist/$ZIP_ELECTRON"

      - name: Notas de la release
        run: |
          cat > notas.md <<EOF
          **PokéSurvivor para Windows $VERSION** (juego $HUELLA)

          ### Español
          1. Descarga **PokeSurvivor-Windows-Setup.exe** y ábrelo. Si el navegador dice que no se descarga a menudo, elige **«Conservar»**.
          2. Windows avisará porque el instalador no va firmado (la firma cuesta dinero y este juego es gratis): en «Windows protegió su PC» pulsa **«Más información»** y luego **«Ejecutar de todas formas»**.
          3. El asistente te deja elegir la carpeta (por defecto la tuya, sin pedir administrador, o para todos los usuarios), los accesos directos del Escritorio y del menú Inicio, y abrir el juego al acabar.

          Para **actualizar**, abre el instalador nuevo: se pone encima de la versión anterior. Para **desinstalar**: Configuración › Aplicaciones › Aplicaciones instaladas › PokéSurvivor. Tu partida (\`%APPDATA%\PokeSurvivor\`) no se borra nunca.
          Hace falta Windows 10 u 11 de 64 bits con WebView2 (Windows 11 ya lo trae).

          ### English
          1. Download **PokeSurvivor-Windows-Setup.exe** and open it. If your browser says it isn't commonly downloaded, choose **“Keep”**.
          2. Windows will warn you because the installer isn't signed (signing costs money and this game is free): in “Windows protected your PC” click **“More info”** and then **“Run anyway”**.
          3. The wizard lets you pick the folder (your user folder by default, no admin needed, or for all users), Desktop and Start menu shortcuts, and opening the game when it finishes.

          To **update**, open the new installer: it installs over the previous version. To **uninstall**: Settings › Apps › Installed apps › PokéSurvivor. Your save (\`%APPDATA%\PokeSurvivor\`) is never deleted.
          Requires 64-bit Windows 10 or 11 with WebView2 (Windows 11 already has it).

          ### Portátil / Portable
          **$ZIP_RUST** y **$ZIP_ELECTRON**: sin instalar, descomprime y abre \`PokeSurvivor/PokeSurvivor.exe\`; la de Electron es de respaldo por si la otra te da problemas. / No install: unzip and open \`PokeSurvivor/PokeSurvivor.exe\`; the Electron one is a fallback in case the other gives you trouble.

          Proyecto de fan sin ánimo de lucro / Non-profit fan project. Pokémon © Nintendo/Creatures/GAME FREAK.
          EOF

      - name: Crear o actualizar la release
        run: |
          set -euo pipefail
          TITULO="PokéSurvivor para Windows $VERSION"
          ARCHIVOS=("desktop-rust/dist/PokeSurvivor-Windows-Setup.exe" "desktop-rust/dist/$ZIP_RUST" "desktop/dist/$ZIP_ELECTRON")
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release upload "$ETIQUETA" "${ARCHIVOS[@]}" --clobber
            gh release edit "$ETIQUETA" --title "$TITULO" --notes-file notas.md --draft=false --prerelease=false --latest
          else
            gh release create "$ETIQUETA" "${ARCHIVOS[@]}" --target "$GITHUB_SHA" --title "$TITULO" --notes-file notas.md --latest
          fi
          gh release view "$ETIQUETA" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
