<!doctype html>
<html><head><meta charset="utf-8"><title>bench</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0;width:1536px;height:864px}</style>
</head><body>
<canvas id="c"></canvas><canvas id="o"></canvas>
<script>
/* Banco de prueba: la mezcla de dibujo de la horda de PokéSurvivor (perf.cjs, Máxima) en Canvas 2D o en WebGL2 por lotes.
 * ?mode=c2d|gl  &spr=700 &part=1100 &txt=90 &sheets=30 &frames=1 (frames: lienzos sueltos por fotograma de sprite, como el filtro de Máxima) */
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'c2d', NSPR = +(Q.get('spr') || 700), NPART = +(Q.get('part') || 1100), NTXT = +(Q.get('txt') || 90);
const NSHEET = +(Q.get('sheets') || 30), LOOSE = Q.get('frames') === '1';
const DPR = 1.25, CW = 1536, CH = 864, W = Math.round(CW * DPR), H = Math.round(CH * DPR), SC = 2 * DPR;
const cv = document.getElementById('c'), ov = document.getElementById('o');
cv.width = W; cv.height = H; ov.width = W; ov.height = H;
const IDS = [1, 4, 7, 10, 13, 16, 19, 21, 23, 25, 27, 29, 32, 35, 37, 39, 41, 43, 46, 48, 50, 52, 54, 56, 58, 60, 63, 66, 69, 72, 74, 77, 79, 81, 84, 86, 88, 90, 92, 95];
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
let rnd = 12345; const R = () => (rnd = (rnd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const COLORS = ['#ff7a3d', '#ffd23f', '#9be3ff', '#7cff8a', '#ff5f6d', '#c9a2ff', '#ffffff', '#ffb0e0', '#a0ffd8', '#ffe9a0'];

(async () => {
  const sheets = (await Promise.all(IDS.slice(0, NSHEET).map(id => load('../../assets/pokemon/' + id + '/Walk.png')))).filter(Boolean);
  // Suelo: 12 trozos de 512 horneados (como World.drawGround).
  const chunks = [];
  for (let k = 0; k < 12; k++) {
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    for (let i = 0; i < 64; i++) for (let j = 0; j < 64; j++) { x.fillStyle = `hsl(${100 + (R() * 30 | 0)},${40 + (R() * 20 | 0)}%,${28 + (R() * 10 | 0)}%)`; x.fillRect(i * 8, j * 8, 8, 8); }
    chunks.push(c);
  }
  // Velo (viñeta) horneado, como World.drawVignette con su degradado guardado.
  const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
  { const x = vig.getContext('2d'), g = x.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  // Niebla del suelo: un lienzo grande semitransparente.
  const fog = document.createElement('canvas'); fog.width = 768; fog.height = 432;
  { const x = fog.getContext('2d'); for (let i = 0; i < 40; i++) { const g = x.createRadialGradient(R() * 768, R() * 432, 0, R() * 768, R() * 432, 120); g.addColorStop(0, 'rgba(220,225,240,0.18)'); g.addColorStop(1, 'rgba(220,225,240,0)'); x.fillStyle = g; x.fillRect(0, 0, 768, 432); } }
  // Sprites: 48×64 por fotograma (Walk: 4-8 columnas × 8 direcciones).
  const FW = 32, FH = 40;
  const ents = []; for (let i = 0; i < NSPR; i++) ents.push({ x: R() * CW, y: R() * CH, s: i % sheets.length, f: (R() * 4) | 0, d: (R() * 8) | 0, vx: R() * 2 - 1, vy: R() * 2 - 1 });
  // Lienzos sueltos por fotograma (filtro «más nítidos» de Máxima: cada fotograma, su lienzo ×3).
  const loose = new Map();
  const looseOf = (s, f, d) => { const k = s * 64 + d * 8 + f; let c = loose.get(k); if (!c) { c = document.createElement('canvas'); c.width = FW * 3; c.height = FH * 3; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(sheets[s], f * FW, d * FH, FW, FH, 0, 0, FW * 3, FH * 3); loose.set(k, c); } return c; };
  const parts = []; for (let i = 0; i < NPART; i++) parts.push({ x: R() * CW, y: R() * CH, c: (R() * COLORS.length) | 0, a: 0.3 + R() * 0.7, s: 2 + R() * 3 });
  const txts = []; for (let i = 0; i < NTXT; i++) txts.push({ x: R() * CW, y: R() * CH, n: String((R() * 999) | 0) });

  const step = () => { for (const e of ents) { e.x += e.vx; e.y += e.vy; if (e.x < 0 || e.x > CW) e.vx *= -1; if (e.y < 0 || e.y > CH) e.vy *= -1; } for (const p of parts) { p.y -= 0.5; if (p.y < 0) p.y = CH; } };
  const ox = document.getElementById('o').getContext('2d');
  const drawText = (x2) => {
    x2.setTransform(DPR, 0, 0, DPR, 0, 0);
    x2.font = '700 14px system-ui'; x2.lineWidth = 3; x2.strokeStyle = '#000'; x2.fillStyle = '#ffd23f';
    for (const t of txts) { x2.strokeText(t.n, t.x, t.y); x2.fillText(t.n, t.x, t.y); }
    // HUD: 2 barras y unos textos
    x2.fillStyle = 'rgba(0,0,0,.5)'; x2.fillRect(10, 10, 300, 18); x2.fillStyle = '#5fe08a'; x2.fillRect(12, 12, 200, 14);
    x2.font = '600 16px system-ui'; x2.fillStyle = '#fff'; x2.fillText('Nv 32  14:02  1234 KO', 330, 24);
  };

  let draw;
  if (MODE === 'pixi') {
    await new Promise(r => { const s = document.createElement('script'); s.src = Q.get('pixi'); s.onload = r; document.head.appendChild(s); });
    const app = new PIXI.Application();
    await app.init({ canvas: cv, width: W, height: H, preference: 'webgl', antialias: false, resolution: 1, autoStart: false, background: '#000' });
    PIXI.TextureSource.defaultOptions.scaleMode = 'nearest';
    const stage = app.stage;
    for (let k = 0; k < 12; k++) { const s = new PIXI.Sprite(PIXI.Texture.from(chunks[k])); s.x = (k % 4) * 512 - 40; s.y = ((k / 4) | 0) * 512 - 60; stage.addChild(s); }
    const f = new PIXI.Sprite(PIXI.Texture.from(fog)); f.width = W; f.height = H; stage.addChild(f);
    const shT = (() => { const c = document.createElement('canvas'); c.width = 28; c.height = 12; const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(14, 6, 14, 6, 0, 0, 6.283); x.fill(); return PIXI.Texture.from(c); })();
    const shs = []; for (let i = 0; i < Math.min(100, ents.length); i++) { const s = new PIXI.Sprite(shT); stage.addChild(s); shs.push(s); }
    const srcs = sheets.map(s => PIXI.Texture.from(s).source);
    const frT = new Map(); const tex = (s, fr, d) => { const k = s * 64 + d * 8 + fr; let t = frT.get(k); if (!t) { t = new PIXI.Texture({ source: srcs[s], frame: new PIXI.Rectangle(fr * FW, d * FH, FW, FH) }); frT.set(k, t); } return t; };
    const sp = ents.map(e => { const s = new PIXI.Sprite(tex(e.s, e.f, e.d)); s.width = FW * SC; s.height = FH * SC; stage.addChild(s); return s; });
    const ps = parts.map(p => { const s = new PIXI.Sprite(PIXI.Texture.WHITE); s.tint = COLORS[p.c]; s.alpha = p.a; s.width = s.height = p.s * DPR; stage.addChild(s); return s; });
    const v = new PIXI.Sprite(PIXI.Texture.from(vig)); stage.addChild(v);
    const ctxO = ov.getContext('2d');
    draw = () => {
      for (let i = 0; i < shs.length; i++) { shs[i].x = ents[i].x * DPR - 14; shs[i].y = ents[i].y * DPR + 4; }
      for (let i = 0; i < ents.length; i++) { const e = ents[i], s = sp[i]; s.x = e.x * DPR - FW * SC / 2; s.y = e.y * DPR - FH * SC; }
      for (let i = 0; i < parts.length; i++) { ps[i].x = parts[i].x * DPR; ps[i].y = parts[i].y * DPR; }
      app.renderer.render(stage);
      ctxO.setTransform(1, 0, 0, 1, 0, 0); ctxO.clearRect(0, 0, W, H); drawText(ctxO);
    };
  } else if (MODE === 'c2d') {
    const ctx = cv.getContext('2d', { alpha: false });
    draw = () => {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
      for (let k = 0; k < 12; k++) ctx.drawImage(chunks[k], (k % 4) * 512 * 1.0 - 40, ((k / 4) | 0) * 512 * 1.0 - 60, 512, 512);
      ctx.globalAlpha = 1; ctx.drawImage(fog, 0, 0, W, H);
      // sombras (elipses) de los 100 primeros
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      for (let i = 0; i < Math.min(100, ents.length); i++) { const e = ents[i]; ctx.beginPath(); ctx.ellipse(e.x * DPR, e.y * DPR + 10, 14, 6, 0, 0, 6.283); ctx.fill(); }
      for (const e of ents) {
        if (LOOSE) ctx.drawImage(looseOf(e.s, e.f, e.d), e.x * DPR - FW * SC / 2, e.y * DPR - FH * SC, FW * SC, FH * SC);
        else ctx.drawImage(sheets[e.s], e.f * FW, e.d * FH, FW, FH, e.x * DPR - FW * SC / 2, e.y * DPR - FH * SC, FW * SC, FH * SC);
      }
      for (const p of parts) { ctx.globalAlpha = p.a; ctx.fillStyle = COLORS[p.c]; ctx.fillRect(p.x * DPR, p.y * DPR, p.s * DPR, p.s * DPR); }
      ctx.globalAlpha = 1;
      ctx.drawImage(vig, 0, 0);
      drawText(ctx);
    };
  } else {
    // ---------- WebGL2: atlas + quads por instancias, una llamada por textura ----------
    const gl = cv.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: false });
    const AT = 4096;
    const atlas = document.createElement('canvas'); atlas.width = AT; atlas.height = AT;
    const ax = atlas.getContext('2d'); let px = 0, py = 0, rowH = 0; const uv = [];
    const put = (img) => { if (px + img.width > AT) { px = 0; py += rowH + 2; rowH = 0; } ax.drawImage(img, px, py); const r = [px, py]; px += img.width + 2; rowH = Math.max(rowH, img.height); return r; };
    for (const s of sheets) uv.push(put(s));
    ax.fillStyle = '#fff'; ax.fillRect(AT - 4, AT - 4, 4, 4);       // píxel blanco: partículas y rectángulos
    const chunkAt = []; for (const c of chunks) chunkAt.push(put(c));
    const vigAt = null;
    const mkTex = (src) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
    const tAtlas = mkTex(atlas), tFog = mkTex(fog), tVig = mkTex(vig);
    const vs = `#version 300 es
      layout(location=0) in vec2 q; layout(location=1) in vec4 r; layout(location=2) in vec4 u; layout(location=3) in vec4 c;
      uniform vec2 res; uniform vec2 ts; out vec2 vu; out vec4 vc;
      void main(){ vec2 p = r.xy + q * r.zw; gl_Position = vec4(p / res * vec2(2.,-2.) + vec2(-1.,1.), 0., 1.); vu = (u.xy + q * u.zw) / ts; vc = c; }`;
    const fs = `#version 300 es
      precision mediump float; uniform sampler2D tx; in vec2 vu; in vec4 vc; out vec4 o;
      void main(){ o = texture(tx, vu) * vc; }`;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
    const uRes = gl.getUniformLocation(pr, 'res'), uTs = gl.getUniformLocation(pr, 'ts');
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const MAXI = 8192, STR = 12, inst = new Float32Array(MAXI * STR);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ib); gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
    for (let i = 1; i <= 3; i++) { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, 4, gl.FLOAT, false, STR * 4, (i - 1) * 16); gl.vertexAttribDivisor(i, 1); }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    let n = 0;
    const quad = (x, y, w, h, u0, v0, uw, vh, r, g, b, a) => { const o = n++ * STR; inst[o] = x; inst[o + 1] = y; inst[o + 2] = w; inst[o + 3] = h; inst[o + 4] = u0; inst[o + 5] = v0; inst[o + 6] = uw; inst[o + 7] = vh;
      inst[o + 8] = r * a; inst[o + 9] = g * a; inst[o + 10] = b * a; inst[o + 11] = a; };
    const flush = (tex, tw, th) => { if (!n) return; gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform2f(uTs, tw, th); gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, n * STR); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n); n = 0; };
    const RGB = COLORS.map(h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255]);
    // Sombra: elipse horneada en el atlas.
    const sh0 = document.createElement('canvas'); sh0.width = 28; sh0.height = 12; { const x = sh0.getContext('2d'); x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(14, 6, 14, 6, 0, 0, 6.283); x.fill(); }
    const shAt = put(sh0); gl.bindTexture(gl.TEXTURE_2D, tAtlas); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
    const ctxO = ov.getContext('2d');
    draw = () => {
      gl.viewport(0, 0, W, H); gl.uniform2f(uRes, W, H);
      for (let k = 0; k < 12; k++) quad((k % 4) * 512 - 40, ((k / 4) | 0) * 512 - 60, 512, 512, chunkAt[k][0], chunkAt[k][1], 512, 512, 1, 1, 1, 1);
      flush(tAtlas, AT, AT);
      quad(0, 0, W, H, 0, 0, 768, 432, 1, 1, 1, 1); flush(tFog, 768, 432);
      for (let i = 0; i < Math.min(100, ents.length); i++) { const e = ents[i]; quad(e.x * DPR - 14, e.y * DPR + 4, 28, 12, shAt[0], shAt[1], 28, 12, 1, 1, 1, 1); }
      for (const e of ents) { const a = uv[e.s]; quad(e.x * DPR - FW * SC / 2, e.y * DPR - FH * SC, FW * SC, FH * SC, a[0] + e.f * FW, a[1] + e.d * FH, FW, FH, 1, 1, 1, 1); }
      for (const p of parts) { const c = RGB[p.c]; quad(p.x * DPR, p.y * DPR, p.s * DPR, p.s * DPR, AT - 3, AT - 3, 1, 1, c[0], c[1], c[2], p.a); }
      flush(tAtlas, AT, AT);
      quad(0, 0, W, H, 0, 0, W, H, 1, 1, 1, 1); flush(tVig, W, H);
      // Textos y HUD: en el lienzo 2D de encima (híbrido).
      ctxO.setTransform(1, 0, 0, 1, 0, 0); ctxO.clearRect(0, 0, W, H); drawText(ctxO);
    };
  }
  window.__ready = true;
  window.__bench = { fr: [] };
  const loop = (ts) => { requestAnimationFrame(loop); const t0 = performance.now(); step(); draw(); window.__bench.fr.push([ts, performance.now() - t0]); };
  requestAnimationFrame(loop);
})();
</script>
</body></html>
