[package]
name = "pokesurvivor"
# El aviso de versión nueva compara este número con la etiqueta win-vX.Y.Z de
# la release (el workflow comprueba que coinciden).
version = "1.0.0"
edition = "2024"
publish = false
description = "PokéSurvivor para Windows: host nativo en Rust (wry/tao sobre WebView2)"
build = "build.rs"

[[bin]]
name = "PokeSurvivor"
path = "src/main.rs"

[dependencies]
wry = { version = "=0.57.2", features = ["devtools"] }
tao = "=0.37.2"
# Las mismas versiones que usa wry, para hablar con WebView2 directamente.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # Actualizar con un clic (src/actualizar.rs): bajar de GitHub (WinHTTP) y comprobar el SHA-256 (BCrypt).
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Threading",
  # ¿Hay un mando conectado al abrir? (XInput y los HID de juego: modo mando desde el principio)
  "Win32_UI_Input",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Prioridad del proceso de la GPU de WebView2 en el planificador de la gráfica (D3DKMT).
  "Wdk_Graphics_Direct3D",
] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
